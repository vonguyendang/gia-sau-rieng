<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Thân vỏ sầu riêng gai góc -->
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#708238"/>
      <stop offset="50%" stop-color="#556b2f"/>
      <stop offset="100%" stop-color="#283618"/>
    </linearGradient>
    <linearGradient id="pulpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe494"/>
      <stop offset="40%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5a36"/>
      <stop offset="100%" stop-color="#4a2e18"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cuống sầu riêng (Stem) -->
  <path d="M48,15 C47,8 51,4 54,3 C56,2.5 58,4 56.5,8 C55,12 53,16 52,19 Z" fill="url(#stemGrad)" />
  <ellipse cx="50" cy="18" rx="4" ry="2" fill="#3e2311" />

  <!-- Gai sầu riêng bao quanh (Thorns / Spikes) -->
  <g fill="url(#shellGrad)">
    <!-- Gai đỉnh & bên trái -->
    <polygon points="46,18 42,12 40,20"/>
    <polygon points="38,20 32,16 33,24"/>
    <polygon points="32,25 24,22 26,30"/>
    <polygon points="25,31 16,30 20,38"/>
    <polygon points="19,39 11,40 16,47"/>
    <polygon points="16,48 9,51 16,57"/>
    <polygon points="16,58 11,63 19,67"/>
    <polygon points="20,68 16,75 25,76"/>
    <polygon points="26,77 24,84 33,83"/>
    <polygon points="34,84 34,91 42,88"/>
    <polygon points="43,89 48,96 52,89"/>
    
    <!-- Gai đáy & bên phải -->
    <polygon points="53,89 60,92 59,85"/>
    <polygon points="60,84 68,85 66,78"/>
    <polygon points="67,77 76,76 72,69"/>
    <polygon points="73,68 81,64 76,59"/>
    <polygon points="77,58 84,52 77,47"/>
    <polygon points="77,46 83,39 74,38"/>
    <polygon points="74,37 78,29 70,30"/>
    <polygon points="69,29 72,21 64,24"/>
    <polygon points="63,23 62,15 56,20"/>
    
    <!-- Thân vỏ chính (Main Spiky Shell Body) -->
    <path d="M50,18 C30,18 16,34 16,54 C16,74 32,88 50,88 C68,88 78,74 78,54 C78,34 70,18 50,18 Z"/>
  </g>

  <!-- Múi sầu riêng bổ mở vàng ươm (Exposed Golden Creamy Durian Segments) -->
  <!-- Vỏ bên trong màu kem nhạt -->
  <path d="M48,22 C34,22 25,36 25,54 C25,71 36,83 48,83 C60,83 71,71 71,54 C71,36 62,22 48,22 Z" fill="#e9edc9" />
  
  <!-- Khe chia múi -->
  <path d="M48,24 Q46,53 47,82" stroke="#ccd5ae" stroke-width="2" stroke-linecap="round"/>

  <!-- Múi vàng óng hạt lép bên trái (Pulp Pod Left) -->
  <path d="M45,28 C37,30 31,39 32,48 C32,54 36,56 44,54 C46,45 46,35 45,28 Z" fill="url(#pulpGrad)" filter="url(#dropShadow)"/>
  <ellipse cx="37" cy="40" rx="3.5" ry="7" fill="#fff" opacity="0.3" transform="rotate(-15 37 40)"/>

  <!-- Múi vàng bên trái phía dưới (Pulp Pod Bottom Left) -->
  <path d="M44,57 C35,58 31,65 33,72 C35,78 41,79 45,76 C46,71 45,63 44,57 Z" fill="url(#pulpGrad)" filter="url(#dropShadow)"/>
  <ellipse cx="37" cy="67" rx="2.5" ry="5" fill="#fff" opacity="0.25" transform="rotate(-10 37 67)"/>

  <!-- Múi vàng bên phải phía trên (Pulp Pod Right Top) -->
  <path d="M50,27 C58,28 64,36 63,46 C63,53 59,55 51,54 C49,44 49,34 50,27 Z" fill="url(#pulpGrad)" filter="url(#dropShadow)"/>
  <ellipse cx="58" cy="38" rx="3.5" ry="7" fill="#fff" opacity="0.3" transform="rotate(15 58 38)"/>

  <!-- Múi vàng bên phải phía dưới (Pulp Pod Bottom Right) -->
  <path d="M51,57 C60,57 65,65 63,73 C62,78 55,79 51,76 C50,71 50,63 51,57 Z" fill="url(#pulpGrad)" filter="url(#dropShadow)"/>
  <ellipse cx="58" cy="67" rx="2.5" ry="5" fill="#fff" opacity="0.25" transform="rotate(10 58 67)"/>
</svg>