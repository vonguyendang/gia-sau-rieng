name: "Cào lùi dữ liệu lịch sử thật (Backfill)"

on:
  workflow_dispatch:
    inputs:
      limit_per_channel:
        description: 'Số video sầu riêng tối đa cào lùi trên mỗi kênh (mặc định 10)'
        required: false
        default: '10'

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Cài đặt các thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Chạy script cào lùi lịch sử thật
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: |
          python scripts/backfill_history.py ${{ github.event.inputs.limit_per_channel || '10' }}

      - name: Tự động commit và push dữ liệu lịch sử thật
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain public/data/)" ]; then
            echo "Phát hiện dữ liệu lịch sử mới trong public/data/. Tiến hành commit..."
            git add public/data/
            git commit -m "chore(data): cào lùi dữ liệu lịch sử thật từ YouTube [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "Không có thay đổi dữ liệu nào. Bỏ qua commit."
          fi

