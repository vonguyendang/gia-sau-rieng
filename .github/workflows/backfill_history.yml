name: "Cào lùi dữ liệu lịch sử thật (Backfill)"

on:
  workflow_dispatch:
    inputs:
      limit_per_channel:
        description: 'Số video sầu riêng tối đa cào lùi trên mỗi kênh (mặc định 10)'
        required: false
        default: '10'

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Cài đặt các thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Chạy script cào lùi lịch sử thật
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
        run: |
          python scripts/backfill_history.py ${{ github.event.inputs.limit_per_channel || '10' }}

      - name: Tự động commit và push dữ liệu lịch sử thật
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Chỉ add các file JSON trong public/data/ (loại trừ hoàn toàn các file tạm/bak)
          git add public/data/*.json

          if git diff --staged --quiet; then
            echo "Không có thay đổi dữ liệu mới. Bỏ qua commit."
            exit 0
          fi

          echo "Phát hiện dữ liệu lịch sử mới trong public/data/. Tiến hành commit..."
          git commit -m "chore(data): cào lùi dữ liệu lịch sử thật từ YouTube [skip ci]"

          # Cơ chế đẩy an toàn kèm tự động đồng bộ lại nếu remote có commit mới
          MAX_RETRIES=4
          COUNT=0
          until git push origin main; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "[LỖI] Không thể push sau $MAX_RETRIES lần thử."
              exit 1
            fi
            echo "Phát hiện nhánh remote có commit mới, đang đồng bộ và thử lại ($COUNT/$MAX_RETRIES)..."
            git fetch origin main
            git rebase -X theirs origin/main || {
              git rebase --abort
              git reset --soft origin/main
              git add public/data/*.json
              git commit -m "chore(data): cào lùi dữ liệu lịch sử thật từ YouTube [skip ci]"
            }
          done
          echo "Đã push dữ liệu lịch sử mới thành công!"

