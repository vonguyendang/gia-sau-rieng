name: "Cập nhật giá sầu riêng tự động"

on:
  schedule:
    # Chạy mỗi 3 tiếng một lần (giờ UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions

concurrency:
  group: update-prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Cài đặt các thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Chạy script lấy và cập nhật giá
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-2.5-flash"
        run: |
          python scripts/fetch_prices.py

      - name: Tự động commit và push dữ liệu mới
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Kiểm tra xem có thay đổi trong thư mục public/data/ hay không
          if [ -n "$(git status --porcelain public/data/)" ]; then
            echo "Phát hiện dữ liệu mới trong public/data/. Tiến hành commit..."
            git add public/data/
            git commit -m "chore(data): tự động cập nhật giá sầu riêng [skip ci]"
            git push
          else
            echo "Không có thay đổi dữ liệu nào. Bỏ qua commit."
          fi

