name: "Cập nhật giá sầu riêng tự động"

on:
  schedule:
    # Chạy tự động các khung giờ ra video của thương lái (Giờ VN = UTC + 7):
    # - 04:35 UTC -> 11:35 VN (Vựa chốt giá trưa)
    # - 06:35 UTC -> 13:35 VN (Quét vét đầu giờ chiều)
    # - 11:35 UTC -> 18:35 VN (Tổng kết thị trường chiều tối)
    - cron: '35 4,6,11 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub Actions

concurrency:
  group: update-prices-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Cài đặt các thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Chạy script lấy và cập nhật giá
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.5-flash"
        run: |
          python scripts/fetch_prices.py

      - name: Tự động commit và push dữ liệu mới
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Chỉ add các file JSON trong public/data/ (loại trừ hoàn toàn các file tạm/bak)
          git add public/data/*.json

          if git diff --staged --quiet; then
            echo "Không có thay đổi dữ liệu mới. Bỏ qua commit."
            exit 0
          fi

          echo "Phát hiện dữ liệu mới trong public/data/. Tiến hành commit..."
          git commit -m "chore(data): tự động cập nhật giá sầu riêng [skip ci]"

          # Cơ chế đẩy an toàn kèm tự động đồng bộ lại nếu remote có commit mới
          MAX_RETRIES=4
          COUNT=0
          until git push origin main; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "[LỖI] Không thể push sau $MAX_RETRIES lần thử."
              exit 1
            fi
            echo "Phát hiện nhánh remote có commit mới, đang đồng bộ và thử lại ($COUNT/$MAX_RETRIES)..."
            git fetch origin main
            git rebase -X theirs origin/main || {
              git rebase --abort
              git reset --soft origin/main
              git add public/data/*.json
              git commit -m "chore(data): tự động cập nhật giá sầu riêng [skip ci]"
            }
          done
          echo "Đã push dữ liệu mới thành công!"

